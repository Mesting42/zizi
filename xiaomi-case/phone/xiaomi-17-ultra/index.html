    <!-- Establish the light site canvas before any remote font or module can
         delay first paint. Page styles can take over once Vue is mounted. -->

      :root {
        color-scheme: light;

      html,

    <script>
      (() => {
        const path = window.location.pathname
        let page = 'home'

        if (path === '/about') page = 'about'
        else if (path === '/articles') page = 'article-archive'
        else if (path.startsWith('/category')) page = 'articles'
        else if (path.startsWith('/article')) page = 'article'
        else if (path.startsWith('/music') || path === '/music-player') page = 'music'
        else if (
          path.startsWith('/vivo-case') ||
          path.startsWith('/foreign-case') ||
          path.startsWith('/flutter-music-case')
        ) page = 'case'

        document.documentElement.classList.add(`page-${page}`)
      })()
    </script>
